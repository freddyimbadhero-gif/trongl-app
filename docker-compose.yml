services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trongl_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trongl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trongl_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-trongl_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trongl_user} -d ${POSTGRES_DB:-trongl_db}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trongl_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # DATABASE_URL is optional. If unset, the backend builds it from
      # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB below, so changing
      # just the password in .env can't drift out of sync anymore.
      POSTGRES_USER: ${POSTGRES_USER:-trongl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trongl_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-trongl_db}
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
