version: '3.8'

services:
  # 1. PostGIS Databáze
  db:
    image: postgis/postgis:16-3.4
    container_name: trongl_db
    restart: always
    environment:
      POSTGRES_USER: trongl_user
      POSTGRES_PASSWORD: trongl_secure_password
      POSTGRES_DB: trongl_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

  # 2. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trongl_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://trongl_user:trongl_secure_password@db:5432/trongl_db
    depends_on:
      - db

volumes:
  postgres_data:
