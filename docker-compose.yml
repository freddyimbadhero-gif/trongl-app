services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trongl_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trongl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trongl_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-trongl_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-trongl_user} -d ${POSTGRES_DB:-trongl_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Pěší routing pro ČR — data se stáhnou a připraví automaticky při buildu
  # (viz osrm/Dockerfile). Ruční spouštění scripts/prepare-osrm-cz.sh už
  # není potřeba.
  osrm:
    build:
      context: .
      dockerfile: osrm/Dockerfile
    container_name: trongl_osrm
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trongl_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trongl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trongl_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-trongl_db}
      POSTGRES_HOST: db
      DATABASE_URL: ${DATABASE_URL:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://osrm:5000}
      GRAPHHOPPER_API_KEY: ${GRAPHHOPPER_API_KEY:-}
      GRAPHHOPPER_BASE_URL: ${GRAPHHOPPER_BASE_URL:-https://graphhopper.com/api/1}
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started

volumes:
  postgres_data:
